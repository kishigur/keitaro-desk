<h1>Keitaro Desk</h1>
<p>個人が自分のメールを整理するためのツールです。一般には配布していません。</p>

<h2 id="privacy">プライバシーポリシー</h2>
<ul>
  <li>このツールは、利用者本人の Gmail を読み取り、下書きを作るためだけに Google のアクセス許可を使います。</li>
  <li>読み取ったメールは利用者の Mac の中だけで扱い、外部のサーバーに送ったり、第三者に渡したりしません。</li>
  <li>接続の情報は Mac のキーチェーンに保存し、利用者はいつでも Google アカウントの設定から接続を取り消せます。</li>
</ul>
